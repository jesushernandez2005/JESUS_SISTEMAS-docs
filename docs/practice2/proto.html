<style>
.bb-board{fill:#F2EDE0}
.bb-gap{fill:#E3DCC8}
[data-mode="dark"] .bb-board{fill:#3A382F}
[data-mode="dark"] .bb-gap{fill:#2C2A23}
@media (prefers-color-scheme: dark){:root:not([data-mode]) .bb-board{fill:#3A382F}:root:not([data-mode]) .bb-gap{fill:#2C2A23}}
</style>
<svg width="100%" viewBox="0 0 680 600" role="img">
<title>Conexiones en protoboard: Raspberry Pi Pico 2W</title>
<desc>Diagrama de protoboard mostrando la Raspberry Pi Pico 2W con GPIO2 a GPIO5 conectados cada uno a una resistencia de 220 ohms en serie con un LED, y GPIO6 y GPIO7 conectados cada uno a un botón, todos regresando al riel de GND de la protoboard.</desc>
<rect class="bb-board" x="20" y="10" width="640" height="580" rx="16"/>
<rect class="bb-gap" x="340" y="10" width="20" height="580"/>

<!-- GND rail -->
<rect x="40" y="558" width="600" height="18" rx="4" fill="#2F5FA8"/>
<text x="50" y="571" font-size="12" fill="#EAF1FB">Riel GND (–)</text>

<!-- Pico 2W body -->
<rect x="310" y="30" width="80" height="300" rx="8" fill="#2E7D4F" stroke="#1D5A38" stroke-width="1"/>
<rect x="335" y="18" width="30" height="18" rx="2" fill="#B9B9B9"/>
<text x="350" y="60" font-size="12" fill="#EAF3EA" text-anchor="middle">Pico 2W</text>

<!-- Pin ticks and labels (left edge) -->
<line x1="300" y1="95" x2="310" y2="95" stroke="#378ADD" stroke-width="2"/>
<text x="295" y="99" font-size="12" fill="var(--text-primary)" text-anchor="end">GP2</text>
<line x1="300" y1="135" x2="310" y2="135" stroke="#378ADD" stroke-width="2"/>
<text x="295" y="139" font-size="12" fill="var(--text-primary)" text-anchor="end">GP3</text>
<line x1="300" y1="175" x2="310" y2="175" stroke="#378ADD" stroke-width="2"/>
<text x="295" y="179" font-size="12" fill="var(--text-primary)" text-anchor="end">GP4</text>
<line x1="300" y1="215" x2="310" y2="215" stroke="#5A5A54" stroke-width="2"/>
<text x="295" y="219" font-size="12" fill="var(--text-primary)" text-anchor="end">GND</text>

<!-- Pin ticks and labels (right edge) -->
<line x1="390" y1="255" x2="400" y2="255" stroke="#378ADD" stroke-width="2"/>
<text x="405" y="259" font-size="12" fill="var(--text-primary)">GP5</text>
<line x1="390" y1="295" x2="400" y2="295" stroke="#378ADD" stroke-width="2"/>
<text x="405" y="299" font-size="12" fill="var(--text-primary)">GP6</text>
<line x1="390" y1="335" x2="400" y2="335" stroke="#378ADD" stroke-width="2"/>
<text x="405" y="339" font-size="12" fill="var(--text-primary)">GP7</text>

<!-- Lane 1: GP2 -> R -> LED0 -> GND, lane x=70 -->
<path d="M300 95 H70 V345" fill="none" stroke="#378ADD" stroke-width="2"/>
<rect x="62" y="345" width="16" height="40" rx="3" fill="#D9C9A3" stroke="#8a7a55" stroke-width="0.5"/>
<rect x="62" y="356" width="16" height="4" fill="#B23A2E"/>
<rect x="62" y="365" width="16" height="4" fill="#B23A2E"/>
<rect x="62" y="374" width="16" height="4" fill="#7B4B2A"/>
<path d="M70 385 V400" fill="none" stroke="#378ADD" stroke-width="2"/>
<polygon points="60,400 80,400 70,425" fill="#E24B4A"/>
<line x1="70" y1="425" x2="70" y2="440" stroke="#E24B4A" stroke-width="3"/>
<line x1="70" y1="440" x2="70" y2="558" fill="none" stroke="#5A5A54" stroke-width="2"/>
<text x="70" y="455" font-size="12" fill="var(--text-primary)" text-anchor="middle">LED0</text>

<!-- Lane 2: GP3 -> R -> LED1 -> GND, lane x=150 -->
<path d="M300 135 H150 V345" fill="none" stroke="#378ADD" stroke-width="2"/>
<rect x="142" y="345" width="16" height="40" rx="3" fill="#D9C9A3" stroke="#8a7a55" stroke-width="0.5"/>
<rect x="142" y="356" width="16" height="4" fill="#B23A2E"/>
<rect x="142" y="365" width="16" height="4" fill="#B23A2E"/>
<rect x="142" y="374" width="16" height="4" fill="#7B4B2A"/>
<path d="M150 385 V400" fill="none" stroke="#378ADD" stroke-width="2"/>
<polygon points="140,400 160,400 150,425" fill="#E24B4A"/>
<line x1="150" y1="425" x2="150" y2="440" stroke="#E24B4A" stroke-width="3"/>
<line x1="150" y1="440" x2="150" y2="558" fill="none" stroke="#5A5A54" stroke-width="2"/>
<text x="150" y="455" font-size="12" fill="var(--text-primary)" text-anchor="middle">LED1</text>

<!-- Lane 3: GP4 -> R -> LED2 -> GND, lane x=230 -->
<path d="M300 175 H230 V345" fill="none" stroke="#378ADD" stroke-width="2"/>
<rect x="222" y="345" width="16" height="40" rx="3" fill="#D9C9A3" stroke="#8a7a55" stroke-width="0.5"/>
<rect x="222" y="356" width="16" height="4" fill="#B23A2E"/>
<rect x="222" y="365" width="16" height="4" fill="#B23A2E"/>
<rect x="222" y="374" width="16" height="4" fill="#7B4B2A"/>
<path d="M230 385 V400" fill="none" stroke="#378ADD" stroke-width="2"/>
<polygon points="220,400 240,400 230,425" fill="#E24B4A"/>
<line x1="230" y1="425" x2="230" y2="440" stroke="#E24B4A" stroke-width="3"/>
<line x1="230" y1="440" x2="230" y2="558" fill="none" stroke="#5A5A54" stroke-width="2"/>
<text x="230" y="455" font-size="12" fill="var(--text-primary)" text-anchor="middle">LED2</text>

<!-- GND straight lane from Pico, x=280 -->
<path d="M300 215 H280 V558" fill="none" stroke="#5A5A54" stroke-width="2"/>

<!-- Lane 4: GP5 -> R -> LED3 -> GND, lane x=460 -->
<path d="M400 255 H460 V345" fill="none" stroke="#378ADD" stroke-width="2"/>
<rect x="452" y="345" width="16" height="40" rx="3" fill="#D9C9A3" stroke="#8a7a55" stroke-width="0.5"/>
<rect x="452" y="356" width="16" height="4" fill="#B23A2E"/>
<rect x="452" y="365" width="16" height="4" fill="#B23A2E"/>
<rect x="452" y="374" width="16" height="4" fill="#7B4B2A"/>
<path d="M460 385 V400" fill="none" stroke="#378ADD" stroke-width="2"/>
<polygon points="450,400 470,400 460,425" fill="#E24B4A"/>
<line x1="460" y1="425" x2="460" y2="440" stroke="#E24B4A" stroke-width="3"/>
<line x1="460" y1="440" x2="460" y2="558" fill="none" stroke="#5A5A54" stroke-width="2"/>
<text x="460" y="455" font-size="12" fill="var(--text-primary)" text-anchor="middle">LED3</text>

<!-- Lane 5: GP6 -> button -> GND, lane x=540 -->
<path d="M400 295 H540 V370" fill="none" stroke="#378ADD" stroke-width="2"/>
<rect x="522" y="370" width="36" height="26" rx="4" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="530" cy="383" r="2.5" fill="#2C2C2A"/>
<circle cx="550" cy="383" r="2.5" fill="#2C2C2A"/>
<line x1="540" y1="396" x2="540" y2="558" fill="none" stroke="#5A5A54" stroke-width="2"/>
<text x="540" y="412" font-size="12" fill="var(--text-primary)" text-anchor="middle">Botón izq.</text>

<!-- Lane 6: GP7 -> button -> GND, lane x=610 -->
<path d="M400 335 H610 V370" fill="none" stroke="#378ADD" stroke-width="2"/>
<rect x="592" y="370" width="36" height="26" rx="4" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="600" cy="383" r="2.5" fill="#2C2C2A"/>
<circle cx="620" cy="383" r="2.5" fill="#2C2C2A"/>
<line x1="610" y1="396" x2="610" y2="558" fill="none" stroke="#5A5A54" stroke-width="2"/>
<text x="610" y="412" font-size="12" fill="var(--text-primary)" text-anchor="middle">Botón der.</text>
</svg>
